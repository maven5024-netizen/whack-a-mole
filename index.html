<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>打地鼠</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#87ceeb 0%, #b5e8a0 45%, #6fbf4a 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #4a2c0f; cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><text y='32' font-size='32'>🔨</text></svg>") 6 6, auto;
  }
  h1 { margin: 0 0 8px; font-size: 40px; text-shadow: 2px 2px 0 #fff8; }
  .panel { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: #fff9; border: 3px solid #8b5a2b; border-radius: 12px;
    padding: 6px 16px; font-size: 18px; font-weight: bold; min-width: 90px; text-align: center;
  }
  .stat span { font-size: 24px; color: #c0392b; }
  #board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    padding: 20px; background: #5a9e3a; border-radius: 20px; border: 5px solid #3d6e26;
    width: min(92vw, 480px);
  }
  .hole { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 0 0 50% 50% / 0 0 30% 30%; }
  .hole::after { /* 洞口前沿 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
    background: radial-gradient(ellipse at 50% 100%, #3b2410 0 55%, #5b3a1a 56% 100%);
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%; z-index: 2;
  }
  .hole::before { /* 洞内暗影 */
    content: ""; position: absolute; left: 6%; right: 6%; bottom: 8%; height: 40%;
    background: #1e1208; border-radius: 50%; z-index: 0;
  }
  .mole {
    position: absolute; left: 50%; bottom: 0; width: 70%; aspect-ratio: 1;
    transform: translate(-50%, 110%); transition: transform .12s ease-out; z-index: 1;
    font-size: min(16vw, 80px); line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .hole.up .mole { transform: translate(-50%, 8%); }
  .hole.hit .mole { transform: translate(-50%, 30%) scale(1, .8); filter: grayscale(.3); }
  .pop {
    position: absolute; left: 50%; top: 20%; z-index: 3; font-weight: bold; font-size: 28px;
    pointer-events: none; animation: floatUp .7s forwards;
  }
  @keyframes floatUp { from { transform: translate(-50%,0); opacity: 1; } to { transform: translate(-50%,-50px); opacity: 0; } }
  .controls { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    font-size: 18px; padding: 10px 22px; border-radius: 12px; border: 3px solid #8b5a2b;
    background: #ffd36b; color: #4a2c0f; font-weight: bold; cursor: inherit; font-family: inherit;
  }
  button:active { transform: translateY(2px); }
  #overlay {
    position: fixed; inset: 0; background: #0008; display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay.show { display: flex; }
  .modal { background: #fff7e0; border: 5px solid #8b5a2b; border-radius: 20px; padding: 28px 40px; text-align: center; }
  .modal h2 { margin: 0 0 10px; font-size: 32px; }
  .modal p { font-size: 20px; margin: 6px 0; }
  .tip { margin-top: 10px; font-size: 14px; opacity: .75; }
</style>
</head>
<body>
  <h1>🔨 打地鼠</h1>
  <div class="panel">
    <div class="stat">得分 <span id="score">0</span></div>
    <div class="stat">时间 <span id="time">30</span></div>
    <div class="stat">最高分 <span id="best">0</span></div>
    <div class="stat">连击 <span id="combo">0</span></div>
  </div>

  <div id="board"></div>

  <div class="controls">
    <select id="level">
      <option value="easy">简单</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难</option>
    </select>
    <button id="startBtn">开始游戏</button>
    <button id="muteBtn">🔊</button>
  </div>
  <div class="tip">🐹 地鼠 +10 ｜ 🌟 金鼠 +30 ｜ 💣 炸弹 -20 并断连击</div>

  <div id="overlay">
    <div class="modal">
      <h2>时间到！</h2>
      <p>本局得分：<b id="finalScore">0</b></p>
      <p id="finalMsg"></p>
      <button id="againBtn">再来一局</button>
    </div>
  </div>

<script>
(() => {
  const LEVELS = {
    easy:   { stay: [900, 1400], gap: [500, 900], max: 1 },
    normal: { stay: [650, 1100], gap: [350, 700], max: 2 },
    hard:   { stay: [450, 800],  gap: [200, 450], max: 3 },
  };
  const GAME_TIME = 30;
  const $ = id => document.getElementById(id);
  const board = $("board");
  const holes = [];
  let score = 0, time = GAME_TIME, combo = 0, running = false;
  let timerId = null, spawnId = null;
  let best = +localStorage.getItem("whackBest") || 0;
  let muted = false;
  $("best").textContent = best;

  // 创建 9 个洞
  for (let i = 0; i < 9; i++) {
    const h = document.createElement("div");
    h.className = "hole";
    h.innerHTML = '<div class="mole"></div>';
    h.state = { active: false, type: null, timeout: null };
    h.addEventListener("pointerdown", e => { e.preventDefault(); whack(h); });
    board.appendChild(h);
    holes.push(h);
  }

  // 简易音效
  let ac;
  function beep(freq, dur = 0.1, type = "square", vol = 0.08) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  const rand = ([a, b]) => a + Math.random() * (b - a);

  function pickType() {
    const r = Math.random();
    if (r < 0.15) return { type: "bomb", emoji: "💣" };
    if (r < 0.25) return { type: "gold", emoji: "🌟" };
    return { type: "mole", emoji: "🐹" };
  }

  function activeCount() { return holes.filter(h => h.state.active).length; }

  function spawn() {
    if (!running) return;
    const cfg = LEVELS[$("level").value];
    if (activeCount() < cfg.max) {
      const free = holes.filter(h => !h.state.active);
      const h = free[Math.floor(Math.random() * free.length)];
      const t = pickType();
      h.state = { active: true, type: t.type, timeout: null };
      h.firstChild.textContent = t.emoji;
      h.classList.remove("hit");
      h.classList.add("up");
      // 时间越少，停留越短
      const speedUp = 1 - (1 - time / GAME_TIME) * 0.3;
      h.state.timeout = setTimeout(() => hide(h, true), rand(cfg.stay) * speedUp);
    }
    spawnId = setTimeout(spawn, rand(cfg.gap));
  }

  function hide(h, missed) {
    clearTimeout(h.state.timeout);
    if (missed && h.state.active && h.state.type !== "bomb") {
      combo = 0; updateHud();
    }
    h.state.active = false;
    h.classList.remove("up", "hit");
  }

  function popText(h, text, color) {
    const p = document.createElement("div");
    p.className = "pop"; p.textContent = text; p.style.color = color;
    h.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  function whack(h) {
    if (!running || !h.state.active) return;
    const type = h.state.type;
    h.state.active = false;
    clearTimeout(h.state.timeout);
    h.classList.add("hit");
    setTimeout(() => hide(h, false), 180);

    if (type === "bomb") {
      score = Math.max(0, score - 20); combo = 0;
      popText(h, "-20", "#c0392b"); beep(120, 0.3, "sawtooth", 0.12);
      board.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration: 200});
    } else {
      combo++;
      const base = type === "gold" ? 30 : 10;
      const bonus = Math.min(Math.floor(combo / 5) * 2, 10);
      score += base + bonus;
      popText(h, "+" + (base + bonus), type === "gold" ? "#e6a700" : "#2c7a1f");
      beep(type === "gold" ? 880 : 520, 0.1, "triangle", 0.12);
    }
    updateHud();
  }

  function updateHud() {
    $("score").textContent = score;
    $("time").textContent = time;
    $("combo").textContent = combo;
  }

  function start() {
    holes.forEach(h => hide(h, false));
    score = 0; time = GAME_TIME; combo = 0; running = true;
    $("overlay").classList.remove("show");
    $("startBtn").textContent = "重新开始";
    $("level").disabled = true;
    updateHud();
    clearInterval(timerId); clearTimeout(spawnId);
    timerId = setInterval(() => {
      time--; updateHud();
      if (time <= 0) end();
    }, 1000);
    spawn();
  }

  function end() {
    running = false;
    clearInterval(timerId); clearTimeout(spawnId);
    holes.forEach(h => hide(h, false));
    $("level").disabled = false;
    $("startBtn").textContent = "开始游戏";
    let msg;
    if (score > best) {
      best = score; localStorage.setItem("whackBest", best);
      $("best").textContent = best; msg = "🎉 新纪录！";
    } else msg = "最高分：" + best;
    $("finalScore").textContent = score;
    $("finalMsg").textContent = msg;
    $("overlay").classList.add("show");
    beep(660, 0.15); setTimeout(() => beep(880, 0.25), 150);
  }

  $("startBtn").onclick = start;
  $("againBtn").onclick = start;
  $("muteBtn").onclick = e => { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; };
})();
</script>
</body>
</html>
